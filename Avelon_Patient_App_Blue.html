/* Separate ambient movement from parallax so both can stay continuous. */
.depth .motif{filter:drop-shadow(0 8px 24px #55799725)}

.orbitScroller.is-sliding{scroll-snap-type:none;scroll-behavior:auto}.portraitLink{cursor:pointer}.physicianDialog{width:min(420px,calc(100% - 32px));max-height:85dvh;border:1px solid #fff;border-radius:26px;padding:22px;background:#f3f8ff;color:#182b43;box-shadow:0 18px 65px #173c6355}.physicianDialog::backdrop{background:#1d35556b}.physicianDialog .portrait{width:62px;height:62px}.homeMap{position:relative;overflow:hidden;margin:12px 0;border-radius:18px;background:#deebf9}.homeMap svg{display:block;width:100%;height:115px}.mapLabel{padding:6px 10px;background:#eef5ff;font-size:12px;color:#365577}.addressLine{overflow-wrap:anywhere}.mapLink{display:inline-flex;align-items:center;text-decoration:none}.addressForm label{display:block;font-weight:600}.addressForm label:has(input[type=checkbox]){display:flex;align-items:center;gap:8px;font-weight:400}

:root{--ink:#10151a;--paper:#fff;--fog:#eef1f4;--blue-accent:#5a99e4;--dark:#13181e;--muted:#405166}
body{background:#dde3ea;color:var(--ink);font-family:"Avenir Next",Avenir,system-ui,sans-serif}
.shell{background:var(--paper);box-shadow:0 28px 90px #1e273128}.depth{display:none}
.shell>header{padding:17px 22px 10px}.brand{font-size:23px;font-weight:720}.brandMark{background:#12171c;border-radius:50%;width:39px;height:39px}.topActions .avatar,.bell{background-color:var(--fog);color:var(--ink);border:0}.badge{background:var(--dark);border-color:white}
main{padding:12px 20px 112px}.hero{text-align:left;padding:12px 5px 21px}.hero p{margin:8px 0 0;color:var(--muted)}.eyebrow{color:#3b4b5e;letter-spacing:.07em}h1{font-size:clamp(42px,11vw,62px);line-height:.98;letter-spacing:-.07em;font-weight:510}h2{font-weight:710}h3{font-weight:700}.muted{color:var(--muted)}
.card{border:1px solid transparent;border-radius:31px;background:var(--fog);box-shadow:none;padding:17px}.card:has(button):hover,button.card:hover{box-shadow:0 9px 26px #1a212a15}.grid .card{padding:13px}.section{margin-top:24px}
.primary,.chatHead .closeChat{background:var(--blue-accent);color:var(--ink);font-weight:760}.soft,.tag{background:#dde3ea;color:var(--ink)}.textbtn{color:#1b2f46}.primary:focus-visible,.soft:focus-visible,button:focus-visible{outline-color:#263f5c}.dayRail .card:first-child{background:#dce7f4;border-color:#b4c7dd}
.pack.card{min-height:144px;background:var(--dark);border:0;color:white;padding:20px;box-shadow:none}.pack strong{font-size:26px}.pack .tag{background:var(--blue-accent);color:var(--ink)}.pack .muted{color:#cdd6e0}.packArt .arch{stroke:#ebf0f7;stroke-opacity:.35}.packArt .wave,.packArt .echo{stroke:var(--blue-accent)}.pack:after{background:radial-gradient(ellipse at 67% 52%,#4f8ed742,transparent 35%)}
nav{bottom:max(8px,env(safe-area-inset-bottom));width:min(calc(100% - 22px),498px);border:1px solid #fff;border-radius:32px;background:#ffffffed;gap:5px;padding:5px;box-shadow:0 7px 30px #1a212a1f}nav button{background:#eaeef2;border-radius:999px;min-height:57px;color:var(--ink);font-weight:650}nav [aria-current=page]{background:var(--blue-accent);color:var(--ink)}
.orbitPanel{background:radial-gradient(ellipse at 50% 42%,#e0ebf7,#dbe2eb 57%,#d8dfe7);box-shadow:none;border-color:#d9dfe7}.orbitStage:before{background:radial-gradient(at 35% 20%,#dbe9f9,#93afcf 84%)}.orbitArc path{stroke:#fff}.orbitButton{color:#222b36}.orbitButton[aria-pressed=true] span{background:var(--dark);color:var(--blue-accent);border-color:var(--dark)}.orbitSlide{background:#fff;border-color:white;box-shadow:none}.orbitDevice.watch:before{background:linear-gradient(90deg,#1d252f,#4a5f77,#1d252f)}.orbitDevice b{background:#192028;color:var(--blue-accent);border-color:#485c73}.labArtwork{filter:grayscale(1) drop-shadow(0 7px 9px #28333f33)}
.trendLabels strong{color:#23374f}.trendLabels.violet strong{color:#5c416f}.chatSheet,.physicianDialog{background:#f4f6f9;color:var(--ink)}.chatHead,.compose{border-color:#d7dee6}.compose{background:#fff}.compose textarea{border-color:#96a8bd}.bubble,.snippet{background:#e2e7ed;color:var(--ink);border-color:#cbd4de}.mine{background:var(--dark);color:white}.breakCard{border-color:#3b5c82}.homeMap{filter:saturate(.27)}.mapLabel{background:#e8ecf0;color:#2e3a49}
body[data-page="package"] .hero,body[data-page="confirmHome"] .hero,body[data-page="visit"] .hero{background:var(--dark);color:white;border-radius:32px;padding:22px;margin-bottom:12px}body[data-page="package"] .hero .eyebrow,body[data-page="confirmHome"] .hero .eyebrow,body[data-page="visit"] .hero .eyebrow{color:var(--blue-accent)}
@media(max-width:365px){main{padding-inline:13px}.orbitButton{min-width:43px;font-size:10px}.orbitButton span{width:38px;height:38px}.shell>header{padding-inline:15px}}

.topActions{align-items:center;gap:8px}.topActions .avatar,.topActions .bell{box-sizing:border-box;width:44px;height:44px;min-width:44px;padding:0;border-radius:50%;flex:0 0 44px}.topActions .portrait--patient{background-size:200% 100%;background-position:left center}
nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:stretch}
nav button{display:grid;grid-template-rows:22px 15px;justify-items:center;align-content:center;gap:4px;padding:4px 1px;min-width:0;line-height:15px;white-space:nowrap}
nav .navIcon{display:block;width:22px;height:22px}

 const target=tone==='violet'?demoTargets.hba1c:demoTargets.weight;

 const line=points.reduce((path,[x,y],i)=>{
  if(!i)return 'M'+x+' '+y;
  const [px,py]=points[i-1],mid=(x+px)/2;
  return path+' C'+mid+' '+py+' '+mid+' '+y+' '+x+' '+y;
 },'');
 const first=points[0],last=points.at(-1);

 const isLab=tone==='violet',unit=isLab?'%':' kg';

 const targetLabel='<div class="trendTarget" title="Demo target and sample sync time"><strong>Target '+format(target)+'</strong><small>Sync 13 nov 1:14pm</small></div>';
 const labels=metricTrio(format(isLab?7.4:74),format(values.at(-1)),format(target));

let callStartedAt=null;
function callEntry(call){
 const time=new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}).format(new Date(call.startedAt));
 const minutes=Math.floor(call.seconds/60),seconds=String(call.seconds%60).padStart(2,'0');
 return '<div class="callEntry"><strong>Outgoing demo call</strong><time datetime="'+new Date(call.startedAt).toISOString()+'">'+escapeHtml(time)+' IST · '+minutes+':'+seconds+'</time></div>';
}
function finishCall(){
 if(callStartedAt===null)return null;
 const call={startedAt:callStartedAt,seconds:Math.max(0,Math.floor((Date.now()-callStartedAt)/1000))};
 callStartedAt=null;
 state.messages.push({call});save();
 return call;
}

function activityHistory(category){
 const entries=Object.entries(state.dayDone).map(([date,ids])=>({
  date,items:ids.map(id=>dayPlan.find(item=>item[0]===id)).filter(item=>item&&(!category||activityCategories[item[0]]===category))
 })).filter(group=>group.items.length).sort((a,b)=>new Date(b.date)-new Date(a.date));
 if(!entries.length)return card('<p class="muted">No '+(category?category.toLowerCase()+' ':'')+'activities have been recorded yet.</p>');
 return entries.map(({date,items})=>'<h2 class="activityDate">'+escapeHtml(date)+'</h2>'+card(items.map(([id,label,scheduled])=>{
  const timestamp=state.activityTimes[date]?.[id];
  const completed=timestamp?new Intl.DateTimeFormat('en-IN',{hour:'numeric',minute:'2-digit',timeZone:'Asia/Kolkata'}).format(new Date(timestamp))+' IST':'Time unavailable';
  return '<div class="row activityRow"><div><h3>'+label+'</h3><p class="muted">'+activityCategories[id]+' · Scheduled '+scheduled+' IST</p><p class="muted">Logged '+escapeHtml(completed)+' · Patient reported</p></div><span class="tag">'+(state.activityOutcomes[date]?.[id]==='not-taken'?'Not taken':state.activityOutcomes[date]?.[id]==='skipped'?'Skipped':'Done')+'</span></div>';
 }).join(''))).join('');
}

function syncOrbit(panel,index){
 if(orbitSelection[panel.dataset.orbit]===index)return;
 orbitSelection[panel.dataset.orbit]=index;
 const buttons=panel.querySelectorAll('.orbitButton');
 buttons.forEach((button,i)=>{
  button.setAttribute('aria-pressed',i===index);
  if(panel.dataset.orbit==='wearable'){
   const [x,y]=orbitPosition(i,buttons.length,index);
   button.style.setProperty('--at',x+'%');
   button.style.setProperty('--top',y+'px');
  }
 });
 panel.querySelectorAll('.orbitSlide').forEach((slide,i)=>slide.classList.toggle('is-active',i===index));
}
const orbitAnimations=new WeakMap();
function stopOrbit(rail){
 const frame=orbitAnimations.get(rail);
 if(frame)cancelAnimationFrame(frame);
 orbitAnimations.delete(rail);
 rail.classList.remove('is-sliding');
}
function scrollOrbit(panel,index,smooth){
 const rail=panel.querySelector('.orbitScroller'),slide=rail.children[index];
 stopOrbit(rail);
 const start=rail.scrollLeft,box=slide.getBoundingClientRect();
 const target=Math.max(0,Math.min(rail.scrollWidth-rail.clientWidth,start+box.left+box.width/2-rail.getBoundingClientRect().left-rail.clientWidth/2));
 if(!smooth||Math.abs(target-start)<1){rail.scrollLeft=target;return;}
 const began=performance.now(),duration=Math.min(590,340+Math.abs(target-start)*.23);
 rail.classList.add('is-sliding');
 function animate(now){
  if(!rail.isConnected){stopOrbit(rail);return;}
  const progress=Math.min(1,(now-began)/duration);
  rail.scrollLeft=start+(target-start)*(1-Math.pow(1-progress,3));
  if(progress<1)orbitAnimations.set(rail,requestAnimationFrame(animate));
  else{stopOrbit(rail);syncOrbit(panel,index);}
 }
 orbitAnimations.set(rail,requestAnimationFrame(animate));
}
function setupOrbits(){
 screen.querySelectorAll('.orbitPanel').forEach(panel=>{
  const rail=panel.querySelector('.orbitScroller');
  scrollOrbit(panel,orbitSelection[panel.dataset.orbit],false);
  for(const event of ['pointerdown','wheel','keydown'])rail.addEventListener(event,()=>stopOrbit(rail),{passive:true});
  let settle;
  rail.addEventListener('scroll',()=>{clearTimeout(settle);settle=setTimeout(()=>{
   if(orbitAnimations.has(rail))return;
   const slides=[...rail.children],offset=slides[0].offsetLeft;
   const nearest=slides.reduce((best,slide,i)=>Math.abs(slide.offsetLeft-offset-rail.scrollLeft)<Math.abs(slides[best].offsetLeft-offset-rail.scrollLeft)?i:best,0);
   const atEnd=rail.scrollLeft>0&&rail.scrollWidth-rail.clientWidth-rail.scrollLeft<2;
   syncOrbit(panel,atEnd?slides.length-1:nearest);
  },100);},{passive:true});
 });
}

function syncWeight(form){
 const [whole,fraction]=[...form.querySelectorAll('.weightWheel')].map((wheel,i)=>{
  const index=Math.max(0,Math.min(wheel.children.length-1,Math.round(wheel.scrollTop/48)));
  const old=Number(wheel.dataset.previousIndex??index);
  for(let row=Math.max(0,Math.min(old,index)-3);row<=Math.min(wheel.children.length-1,Math.max(old,index)+3);row++){
   const distance=row-wheel.scrollTop/48,step=Math.min(3,Math.abs(distance)),style=wheel.children[row].style;
   style.setProperty('--wheel-angle',(Math.max(-3,Math.min(3,distance))*-19)+'deg');
   style.setProperty('--wheel-scale',1-step*.065);
   style.setProperty('--wheel-opacity',1-step*.15);
  }
  wheel.dataset.previousIndex=index;
  wheel.querySelector('[aria-current=true]')?.removeAttribute('aria-current');
  wheel.children[index].setAttribute('aria-current','true');
  const value=index+(i===0?1:0);
  wheel.setAttribute('aria-valuenow',value);
  return value;
 });
 const value=(Math.min(999,whole+fraction/10)).toFixed(1);
 form.elements.value.value=value;
 form.querySelector('.weightPreview').textContent=value+' kg';
}

 wheels[1].scrollTo({top:(tenths%10)*48,behavior:'instant'});
 syncWeight(form);
}

 case 'weight':return back('goals')+hero('Weight management','Weight trend')+card('<div class="row"><div><h3>Latest weight</h3><span class="metric">'+latest().value.toFixed(1)+' <small>kg</small></span></div><span class="tag">'+latest().date+'</span></div>'+trend(weights().slice(-6),[68,77])+'<p class="muted">Baseline 74.0 kg · Latest '+latest().value.toFixed(1)+' kg</p><div class="actions">'+btn('Log weight','log')+btn('Ask my doctor','chat','soft')+'</div>');
 case 'lab':return back('goals')+hero('HbA1c monitoring','HbA1c trend')+card(reportHeading('HbA1c result','vial')+labStatus(labOrbit[0])+'<span class="tag">4 Nov 2026</span><span class="metric">6.8 <small>%</small></span>'+trend([7.4,7.1,6.8],[6,8],'violet')+'<p class="muted">Previous released results: 7.4%, 7.1%.</p><div class="actions">'+btn('Ask my doctor','chat','soft')+'</div>')+sec('Report status')+card(reportHeading('New HbA1c report','report')+labStatus(labOrbit[1])+'<p class="muted">Your care team will share the next update here.</p>');
 case 'log':return back('weight')+hero('Weight management','Log weight')+card(weightForm());
 case 'history':return back('profile')+hero('My profile','Activity history')+activityHistory();
 case 'doctorProfile':return doctorProfile();
 case 'chat':return chat();
 case 'break':return breakScreen();
 case 'notifications':return back(inboxFrom)+hero('Updates','Notifications')+sec('Your inbox',unread()?'<button class="textbtn" data-mark-all>Mark all read</button>':'')+notifications().map(n=>card('<div class="row"><h3>'+escapeHtml(n.title)+'</h3>'+(!state.notificationRead.includes(n.id)?'<span class="tag">New</span>':'')+'</div><p class="muted">'+escapeHtml(n.detail)+'</p><div class="actions"><button class="soft" data-open-notification="'+n.id+'">View update</button></div>')).join('');
 case 'package':return back('home')+hero('Active subscription','Your package')+packageBanner(false)+planPackageDetails()+sec('Your services')+card('<h3>Care plan and goal tracking</h3><p class="muted">Weight management and HbA1c monitoring</p><div class="actions">'+btn('View my plan','plan','soft')+btn('Contact care team','doctor')+'</div>')+sec('Device')+card('<p class="muted">Wearable tracking preview</p>'+btn('View device','device','textbtn'));
 case 'vitals':return back('home')+hero('Your measurements','Vitals & readings')+sec('Tracked readings',btn('Device','device','textbtn'))+vitalDetails();
 case 'reading':{const r=metrics[selectedReading];return back('vitals')+hero('Tracked reading',r.label)+card(reportHeading('Latest reading',readingIcons[selectedReading])+statusChip('Recorded')+'<span class="metric">'+r.value+'</span><p class="muted">'+r.date+' · '+r.source+'</p><ul class="history">'+r.history.map(([date,value])=>'<li><span>'+date+'</span><strong>'+value+'</strong></li>').join('')+'</ul><div class="actions">'+btn('Ask my doctor','chat')+'</div>');}
 case 'device':return back('vitals')+hero('Device','Wearable readings')+card('<span class="tag">Sample data</span><h2>Wearable preview</h2><p class="muted">Resting heart rate, blood oxygen and daily steps. Last sample · 21 Nov 2026, 7:35 AM IST.</p><div class="actions">'+btn('View tracked readings','vitals','soft')+'</div>');
 case 'homeAddress':return addressEditor();
 case 'confirmHome':return back('book')+hero('Home visit','Confirm your visit')+card('<h3>Home consultation with '+clinician.name+'</h3><p class="muted">'+escapeHtml(homeSlot)+' IST · '+clinician.specialty+'</p>')+homeCard(visitAddress())+(visitAddress()&&openSlots().includes(homeSlot)?card('<button type="button" class="primary" data-confirm-home>Confirm home visit</button>'):card('<p>Review your address and select an available time.</p>'));
 case 'book':return back('doctor')+hero('Dr. Ananya Rao','Book a visit','Select a visit type and an available time. Times are in IST.')+card('<div class="actions">'+Object.keys(slotsByKind).map(k=>'<button class="'+(k===kind?'primary':'soft')+'" data-kind="'+k+'" aria-pressed="'+(k===kind)+'">'+k+'</button>').join('')+'</div>')+(kind==='Home'?homeCard(visitAddress()):'')+card('<h3>Available times</h3><div class="list">'+(openSlots().filter(()=>kind!=='Home'||visitAddress()).map(s=>'<button class="soft" data-slot="'+s+'">'+s+'</button>').join('')||'<p class="muted">'+(kind==='Home'&&!visitAddress()?'Add an address to see times.':'No slots available for this visit type.')+'</p>')+'</div>');
 case 'visit':{const b=Object.hasOwn(sampleVisits,selectedVisit)?sampleVisits[selectedVisit]:state.bookings[selectedVisit];return back('doctor')+hero('Appointment',b?'Visit details':'Upcoming visits')+(b?card('<h3>'+escapeHtml(b.kind)+' with Dr. Ananya Rao</h3><p class="muted">'+escapeHtml(b.slot)+' IST · '+(b.sample?(b.completed?'Sample · Completed':'Sample appointment'):(bookingTime(b.slot)<Date.now()?'Past booking':'Confirmed in demo'))+'</p>'+(b.topic?'<p class="muted">'+b.topic+'</p>':'')+'<div class="actions">'+btn('Message doctor','chat','soft')+'</div>')+(b.kind==='Home'?(b.address?homeCard(b.address,false):card('<p class="muted">This earlier booking has no address on file. Message your care team to confirm the location.</p>')):''):visits());}
 }
}
function render(){
 document.body.dataset.page=page;
 document.body.classList.toggle('chatOpen',page==='chat');
 document.querySelector('header').inert=page==='chat';nav.inert=page==='chat';
 const count=unread(),badge=document.querySelector('.bell .badge');
 badge.hidden=!count;badge.textContent=count;
 document.querySelector('.bell').setAttribute('aria-label',count?'Notifications, '+count+' unread':'Notifications');
 screen.innerHTML=content();
 setupOrbits();
 if(page==='log'){
  const form=screen.querySelector('#weightForm');
  setupWeight(form,latest().value);
  form.querySelectorAll('.weightWheel').forEach(wheel=>wheel.addEventListener('scroll',()=>{if(!form.querySelector('.weightPicker').hidden)syncWeight(form);},{passive:true}));
 }
 if(page==='chat'){const thread=screen.querySelector('.thread');thread.scrollTop=thread.scrollHeight;}
 nav.innerHTML=pages.map(([id,label,icon])=>'<button data-tab data-go="'+id+'" '+((page===id||id==='goals'&&['weight','lab','log'].includes(page)||id==='doctor'&&['chat','book','visit'].includes(page))?'aria-current="page"':'')+'><svg class="navIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+icon+'</svg>'+label+'</button>').join('');
}
function move(target, focus=true,backward=false){
 if(!routes.includes(target)||target===page||moving)return;
 const old=page;
 if(old==='chat')finishCall();
 if(previousPages.at(-1)===target)previousPages.pop();
 else if(!backward)previousPages.push(old);
 if(target==='homeAddress'&&!backward)addressFrom=old;
 if(target==='notifications'&&!backward)inboxFrom=old;
 if(target==='break'&&!backward)breakFrom=old;
 if(target==='chat'){chatFrom=old;attachment=contextFor(old);}
 document.documentElement.style.setProperty('--dir',routes.indexOf(target)>=routes.indexOf(old)?1:-1);
 function update(){page=target;notice='';render();scrollTo(0,0);if(focus)screen.querySelector('h1')?.focus({preventScroll:true});}
 if(target!=='chat'&&old!=='chat'&&document.startViewTransition&&!matchMedia('(prefers-reduced-motion: reduce)').matches){moving=true;document.startViewTransition(update).finished.finally(()=>{moving=false;});}else update();
}
document.addEventListener('click',e=>{
 const el=e.target.closest('button');if(!el||moving)return;
 if(el.hasAttribute('data-chat-call')){
  const status=screen.querySelector('[data-call-status]');
  if(callStartedAt===null){callStartedAt=Date.now();el.textContent='End call';status.textContent='Demo call in progress';}
  else{
   const entry=finishCall(),thread=screen.querySelector('.thread');
   thread.insertAdjacentHTML('beforeend',callEntry(entry));
   thread.scrollTop=thread.scrollHeight;
   el.textContent='Call';status.textContent='Demo call logged';
  }
  return;
 }
 if(el.dataset.taskMenu){showTaskSheet(el);return;}
 if(el.hasAttribute('data-sheet-close')){document.querySelector('#task-sheet').close();return;}
 if(el.dataset.sheetOutcome){
  document.querySelector('#task-sheet').close();
  if(sheetTask?.isConnected){sheetTask.dataset.outcome=el.dataset.sheetOutcome;sheetTask.focus();sheetTask.click();}
  return;
 }
 if(el.hasAttribute('data-doctor-details')){showDoctor();return;}
 if(el.hasAttribute('data-doctor-close')){document.querySelector('#physician-dialog').close();return;}
 if(el.hasAttribute('data-use-registered')){homeDraft=null;render();return;}
 if(el.hasAttribute('data-confirm-home')){if(kind==='Home')saveVisit(homeSlot,visitAddress());return;}
 if(el.hasAttribute('data-banner-toggle')){
  state.bannerMinimized=!state.bannerMinimized;save();
  const banner=el.closest('.bannerShell');banner.outerHTML=packageBanner();
  screen.querySelector('[data-banner-toggle]').focus({preventScroll:true});return;
 }
 if(el.dataset.wheelValue!==undefined){el.closest('.weightWheel').scrollTo({top:Number(el.dataset.wheelValue)*48,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});return;}
 if(el.hasAttribute('data-weight-mode')){
  const form=el.closest('form'),picker=form.querySelector('.weightPicker'),keypad=form.querySelector('[data-keypad]');
  if(picker.hidden){
   if(!form.elements.value.reportValidity())return;
   const value=Number(form.elements.value.value);
   picker.hidden=false;keypad.hidden=true;setupWeight(form,value);el.textContent='Use keypad';form.querySelector('.weightWheel').focus();
  }else{
   syncWeight(form);picker.hidden=true;keypad.hidden=false;el.textContent='Use wheels';form.elements.value.focus();
  }
  return;
 }
 if(el.dataset.extraLab!==undefined){selectedExtraLab=Number(el.dataset.extraLab);move('extraLab');return;}
 if(el.dataset.orbitIndex!==undefined){const panel=el.closest('.orbitPanel'),index=Number(el.dataset.orbitIndex);syncOrbit(panel,index);scrollOrbit(panel,index,!matchMedia('(prefers-reduced-motion: reduce)').matches);return;}
 if(el.dataset.profileSection){const left=el.closest('.profileTabs').scrollLeft;profileSection=el.dataset.profileSection;render();const tabs=screen.querySelector('.profileTabs');tabs.scrollLeft=left;tabs.querySelector('[aria-pressed=true]').focus({preventScroll:true});return;}
 if(el.dataset.task){
  const eventDay=today(),done=state.dayDone[eventDay]||[],rail=el.closest('.dayRail'),taskCard=el.closest('.card');
  if(done.includes(el.dataset.task))return;
  state.dayDone[eventDay]=[...done,el.dataset.task];
  if(['not-taken','skipped'].includes(el.dataset.outcome)){state.activityOutcomes[eventDay]??={};state.activityOutcomes[eventDay][el.dataset.task]=el.dataset.outcome;}
  state.activityTimes[eventDay]??={};
  state.activityTimes[eventDay][el.dataset.task]=new Date().toISOString();
  save();el.disabled=true;
  const finish=()=>{
   if(!taskCard.isConnected)return;
   const focused=document.activeElement===el||document.activeElement===document.body;
   const next=taskCard.nextElementSibling?.querySelector('[data-task]')||taskCard.previousElementSibling?.querySelector('[data-task]');
   const count=state.dayDone[eventDay].length;
   taskCard.remove();
   const progress=screen.querySelector('[data-task-count]');
   progress.textContent=count+' of '+dayPlan.length+' logged';
   const summary=screen.querySelector('[data-completed-summary]');
   if(summary)summary.textContent=count+' logged today. Full entries are stored in your profile.';
   const first=screen.querySelector('.card:not(.leaving) [data-task]');
   if(first){
    const firstCard=first.closest('.card'),label=firstCard.querySelector('[data-task-label]');
    if(label)label.textContent='Up next';
    else if(!firstCard.querySelector('[data-up-next]'))firstCard.querySelector('.row').insertAdjacentHTML('beforeend','<span class="tag" data-up-next>Up next</span>');
   }else if(count===dayPlan.length&&!screen.querySelector('[data-task]')&&!screen.querySelector('[data-all-done]')){
    const empty=card('<p data-all-done role="status">All scheduled activities are logged.</p>');
    if(rail&&rail.isConnected){rail.insertAdjacentHTML('afterend',empty);rail.remove();}
    else if(!rail)progress.closest('.section').insertAdjacentHTML('afterend',empty);
   }
   if(focused)(next?.isConnected&&!next.disabled?next:screen.querySelector('h1'))?.focus({preventScroll:true});
  };
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){finish();return;}
  taskCard.classList.add('leaving');setTimeout(finish,280);return;
 }
 if(el.hasAttribute('data-end-break')){
  const b=currentBreak();if(!b)return;
  b.closed=b.start>dayKey()?'cancelled':'resumed';
  state.messages.push(b.closed==='cancelled'?'I’ve cancelled my scheduled care break.':'I’ve resumed my routine care check-ins.');
  save();notice=b.closed==='cancelled'?'Break cancelled. Update saved for your doctor.':'Check-ins resumed. Update saved for your doctor.';render();screen.querySelector('h1')?.focus();return;
 }
 if(el.hasAttribute('data-mark-all')){state.notificationRead=notifications().map(n=>n.id);save();render();return;}
 if(el.dataset.openNotification){
  const n=notifications().find(x=>x.id===el.dataset.openNotification);
  if(!n)return;
  if(!state.notificationRead.includes(n.id))state.notificationRead.push(n.id);
  if(n.visit!==undefined)selectedVisit=n.visit;
  save();move(n.target);return;
 }
 if(el.hasAttribute('data-read-update')){state.updateRead=true;save();render();return;}
 if(el.dataset.back){goBack(el.dataset.back);return;}
 if(el.hasAttribute('data-remove')){const draft=screen.querySelector('#message').value;attachment=null;render();const field=screen.querySelector('#message');field.value=draft;field.focus();return;}
 if(el.dataset.prompt){const field=screen.querySelector('#message');field.value=el.dataset.prompt;field.focus();return;}
 if(el.dataset.reading){selectedReading=el.dataset.reading;move('reading');return;}
 if(el.dataset.go){if(el.hasAttribute('data-tab'))previousPages.length=0;move(el.dataset.go,true,el.hasAttribute('data-tab'));return;}
 if(el.dataset.kind){kind=el.dataset.kind;render();screen.querySelector('[aria-pressed=true]')?.focus();return;}
 if(el.dataset.visit!==undefined){selectedVisit=el.dataset.visit;move('visit');return;}
 if(el.dataset.slot&&openSlots().includes(el.dataset.slot)){if(kind==='Home'){if(visitAddress()){homeSlot=el.dataset.slot;move('confirmHome');}}else saveVisit(el.dataset.slot);}
});
document.addEventListener('submit',e=>{
 e.preventDefault();const data=new FormData(e.target);
 if(e.target.id==='homeAddressForm'){
  const next=Object.fromEntries(['line','area','pin','notes'].map(key=>[key,String(data.get(key)||'').trim()]));
  if(!next.line||!next.area||!/^\d{6}$/.test(next.pin)){screen.querySelector('#home-error').textContent='Enter a street address, area and city, and a six-digit PIN code.';return;}
  if(data.get('remember')){state.homeAddress=next;homeDraft=null;save();}else homeDraft=next;
  move(addressFrom);return;
 }
 if(e.target.id==='breakForm'){
  const start=data.get('start'),end=data.get('end'),note=String(data.get('note')||'').trim();
  if(!start||!end||start<dayKey()||end<start){notice='Choose a start date today or later and an end date on or after the start.';render();const form=screen.querySelector('#breakForm');form.elements.start.value=start;form.elements.end.value=end;form.elements.note.value=note;form.elements.end.focus();return;}
  if(currentBreak())return;
  const record={start,end,note};state.breakRecords.push(record);
  state.messages.push('I’m taking a care break '+dateRange(record)+'.'+(note?' '+note:''));
  save();notice='Care break saved in your conversation with Dr. Rao.';render();screen.querySelector('h1')?.focus();return;
 }
 if(e.target.id==='weightForm'){if(!e.target.querySelector('.weightPicker').hidden)syncWeight(e.target);const value=Number(e.target.elements.value.value);if(!Number.isFinite(value)||value<1||value>999)return;state.weights.push({value,date:today()});save();move('weight');}
 if(e.target.id==='chatForm'){const message=data.get('message').trim();if(!message)return;state.messages.push({text:message,reading:attachment});attachment=null;save();notice='Message saved in this demo.';render();screen.querySelector('#message').focus();}
});
document.addEventListener('keydown',event=>{
 const wheel=event.target.closest?.('.weightWheel');
 if(!wheel||!['ArrowUp','ArrowDown','Home','End'].includes(event.key))return;
 event.preventDefault();
 const top={ArrowUp:wheel.scrollTop-48,ArrowDown:wheel.scrollTop+48,Home:0,End:(wheel.children.length-1)*48}[event.key];
 wheel.scrollTop=top;syncWeight(wheel.closest('form'));
});
document.addEventListener('keydown',event=>{
 if(page!=='chat'||document.querySelector('#physician-dialog')?.open)return;
 if(event.key==='Escape'){event.preventDefault();goBack(chatFrom);return;}
 if(event.key!=='Tab')return;
 const controls=[...screen.querySelectorAll('.chatSheet button,.chatSheet textarea')];
 const first=controls[0],last=controls.at(-1);
 if(event.shiftKey&&(document.activeElement===first||document.activeElement===screen.querySelector('h1'))){event.preventDefault();last.focus();}
 else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
});
function syncChatViewport(){
 const viewport=window.visualViewport;
 if(!viewport)return;
 const root=document.documentElement;
 root.style.setProperty('--chat-height',viewport.height+'px');
 root.style.setProperty('--chat-top',viewport.offsetTop+'px');
}
window.visualViewport?.addEventListener('resize',syncChatViewport);
window.visualViewport?.addEventListener('scroll',syncChatViewport);
syncChatViewport();
const depth=document.querySelector('.depth');
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)');
let offsetX=0,offsetY=0,targetX=0,targetY=0,frameId=0;
function motionFrame(){
 offsetX+=(targetX-offsetX)*.1;offsetY+=(targetY-offsetY)*.1;
 depth.style.setProperty('--x',offsetX.toFixed(2)+'px');
 depth.style.setProperty('--y',offsetY.toFixed(2)+'px');
 const shell=depth.parentElement;
 shell.style.setProperty('--bx',(offsetX*.55).toFixed(2)+'px');
 shell.style.setProperty('--by',(offsetY*.25).toFixed(2)+'px');
 frameId=Math.abs(targetX-offsetX)+Math.abs(targetY-offsetY)>.08?requestAnimationFrame(motionFrame):0;
}
function cueMotion(){if(!frameId&&!reduceMotion.matches)frameId=requestAnimationFrame(motionFrame);}
addEventListener('pointermove',e=>{targetX=Math.max(-22,Math.min(22,(e.clientX-innerWidth/2)*.045));cueMotion();},{passive:true});
addEventListener('scroll',()=>{targetY=Math.min(70,scrollY*.17);cueMotion();},{passive:true});
render();
</script></body></html>
