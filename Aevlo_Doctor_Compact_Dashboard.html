:root{--ink:#263956;--muted:#8595ae;--blue:#688ce5;--mag:#be8ad4;--bg:#f8faff;--line:#e9edf5;--shadow:0 8px 35px #526c9c0b}
body{background:linear-gradient(160deg,#fbfcff,#f4f8ff 55%,#fcf8ff);font-family:'DM Sans',sans-serif}
.side{border-right:1px solid #eef1f7;box-shadow:5px 0 30px #667da807}
.brand .word{font-size:22px;letter-spacing:-.8px}.brand small{letter-spacing:2px}
.nav button{border-radius:15px;transition:background .25s,color .25s,transform .25s}.nav button:hover{transform:translateX(3px)}
.main{padding-top:24px}.top{margin-bottom:22px}.top h1{font-size:23px;letter-spacing:-.7px}
.backbtn{border:0;background:transparent;color:#6985ba;padding:5px 0;display:inline-flex;align-items:center;gap:5px;font-weight:800;margin-bottom:6px}
.backbtn:hover{color:#476fd2}.primary{background:linear-gradient(115deg,#6e95ed,#8b89e5);box-shadow:0 7px 18px #7495e82a}
.ghost{background:#f0f5ff;color:#607ebc}.danger{background:#fff1f6;color:#bc6384}
.primary,.ghost,.danger,.iconbtn,.quick,.pill{transition:transform .2s ease,background .2s ease,box-shadow .2s ease}
.primary:hover,.ghost:hover,.danger:hover,.iconbtn:hover{transform:translateY(-2px)}
.panel,.stat,.package-card,.doctor-card{box-shadow:0 8px 35px #526c9c0b;border-radius:23px}
.dash-welcome{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:2px 0 24px}
.dash-welcome h2{font-size:clamp(26px,3vw,38px);margin:3px 0 6px;letter-spacing:-1.4px}
.dash-welcome p{margin:0;color:#8494ad}
.dash-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:27px}
.metric{display:flex;align-items:flex-start;flex-direction:column;gap:7px;text-align:left;background:#fff;border:1px solid #e9eef8;border-radius:22px;padding:20px;min-width:0;box-shadow:0 10px 30px #6d88b90b;transition:transform .25s,box-shadow .25s}
.metric:hover{transform:translateY(-4px);box-shadow:0 18px 38px #738dc21c}
.metric-icon{display:grid;place-items:center;background:#edf3ff;color:#7090d9;border-radius:13px;width:40px;height:40px}
.metric span{font-size:12px;color:#8190a9;font-weight:700}.metric strong{font:800 30px Manrope}.metric small{color:#6989d5;font-weight:700}
.dash-main-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,1fr);gap:20px;margin-bottom:27px}
.dash-main-grid .sectionbar{margin:0 0 13px}.dash-main-grid .sectionbar h3{font-size:19px;margin-top:4px}
.dash-primary,.dash-secondary{min-width:0}.ongoing-list,.followup-stack{display:grid;gap:12px}
.journey-card{background:#fff;border:1px solid #e8edf7;border-radius:23px;padding:19px;box-shadow:0 10px 34px #6986b00d;animation:riseIn .55s both}
.journey-card:nth-child(2){animation-delay:.07s}.journey-card:nth-child(3){animation-delay:.14s}
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.journey-top{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.journey-person{flex:1;min-width:120px;display:grid}.journey-person strong{font-size:15px}.journey-person span{font-size:11px;color:#8494aa}
.journey-meta{display:flex;gap:16px;flex-wrap:wrap;color:#8594ab;font-size:11px;margin:14px 0}
.journey-meta span{display:flex;align-items:center;gap:5px}.journey-meta svg{width:15px;height:15px}
.journey-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:18px 0 16px}
.journey-step{position:relative;text-align:center;color:#a1acc0;font-size:10px;font-weight:800;min-width:0}
.journey-step:before{content:'';height:3px;position:absolute;left:-50%;right:50%;top:6px;background:#e8edf7}
.journey-step:first-child:before{display:none}
.journey-step.reached:before{background:#95aaf1}
.journey-step-dot{width:14px;height:14px;border:3px solid #e1e8f5;background:#fff;border-radius:50%;margin:0 auto 6px;position:relative;z-index:1}
.journey-step.reached .journey-step-dot{background:#7193e9;border-color:#b4c7f9}.journey-step.reached{color:#6582c5}
.journey-actions{display:flex;flex-wrap:wrap;gap:7px}.journey-actions button{padding:9px 11px;font-size:11px}
.care-task{display:grid;gap:12px;background:#fff;border:1px solid #e9eef7;border-radius:20px;padding:15px;min-width:0;box-shadow:0 6px 20px #6880a508}
.care-task-top{display:flex;align-items:flex-start;gap:10px;min-width:0}.care-task-info{flex:1;min-width:0}
.care-task-info strong{display:block;overflow-wrap:anywhere;font-size:13px}.care-task-info .sub{margin-top:4px}
.care-task-actions{display:flex;gap:6px;flex-wrap:wrap}.care-task-actions button{padding:7px 9px;font-size:10px;border-radius:10px}
.care-task-actions svg{width:13px;height:13px}.care-task .chip{flex-shrink:0}
.soft-promo{position:relative;overflow:hidden;margin-top:15px;background:linear-gradient(130deg,#e6f0ff,#f4eaff);border:1px solid #e5eafb;border-radius:23px;padding:23px;min-height:210px}
.soft-promo h3{max-width:270px;font-size:21px;line-height:1.3;margin:15px 0 8px;position:relative;z-index:1}
.soft-promo p{font-size:12px;color:#7585a2;max-width:250px;position:relative;z-index:1}
.soft-promo button,.soft-promo .chip{position:relative;z-index:1}

function min(t){let [h,m]=t.split(':').map(Number);return h*60+m}function hh(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}

startShared=function(id){let a=appointments.find(x=>x.id===id);if(!a)return;doctorStartFixed(id);if(a.status==='In consultation'){a.startedAt??=dateTime();v4Focus=id;clinicalId=a.patientId;currentView='clinicalDetail';render();persist()}};
const doctorProfileFixed=clinicalDetail;
clinicalDetail=function(){let html=doctorProfileFixed(),p=findP(clinicalId),a=p&&v4OpenSession(p);if(!a||a.status!=='In consultation')return html;let t=document.createElement('template');t.innerHTML=html;let card=t.content.querySelector('.v5session');if(!card)return html;card.style.display='block';card.innerHTML=`<div class="v12heading"><b>${h(a.type+' · '+a.date+' · '+a.time)}</b>${chip('In consultation')}</div><div class="doctorClinicalThree">${doctorClinicalLabels(a).map((x,i)=>action(x,`v11Edit(${a.id},'${['rx','labs','notes'][i]}')`,'ghost')).join('')}</div><div class="doctorClinicalFooter">${btn('Message Navigator',`v5OpenChat(${a.patientId})`)}${btn('Notify Navigator',`delayForm(${a.id})`)}${action('Complete Consultation',`v11Finish(${a.id})`,'primary')}</div>`;return t.innerHTML};
function doctorClinicalLabels(a){let d=v11Draft(a),n=d.rx.length,l=d.labs.length,saved=Object.values(d.notes).some(v=>String(v||'').trim());return ['Prescription'+(n?`<span class="clinicalCount">${n} ${n===1?'medicine':'medicines'}</span>`:''),'Lab tests'+(l?`<span class="clinicalCount">${l} ${l===1?'lab test':'lab tests'}</span>`:''),'Observations'+(saved?'<span class="clinicalCount">Notes saved</span>':'')]}
document.body.appendChild($('overlay'));
const modalObserver=new MutationObserver(()=>{document.body.classList.toggle('clinicalModalOpen',$('overlay').classList.contains('show'))});modalObserver.observe($('overlay'),{attributes:true,attributeFilter:['class']});
render();persist();

const compactDashBase=doctorDashboardV3;
doctorDashboardV3=function(){let t=document.createElement('template');t.innerHTML=compactDashBase();let c=t.content.querySelector('.v4current'),top=t.content.querySelector('.v4top');if(!c||!top)return t.innerHTML;let active=c.querySelector('.v10actions');if(active){active.querySelector('.v10live')?.remove();c.querySelector('.v8coordactions')?.remove();}let stats=c.querySelector('.v4statline');if(stats){stats.classList.add('doctorDashMetrics');top.after(stats)}return t.innerHTML};
render();persist();
</script></body></html>
